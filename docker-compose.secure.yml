# ---------------------------------------------------------------------------
# FASES 4-6 · ESCENARIO ENDURECIDO
#   Requisitos previos:  ./scripts/gen_certs.sh  y  ./scripts/gen_env.sh
#   Arranque:            docker compose -f docker-compose.secure.yml up -d --build
#
# Cierre de superficie: solo nginx publica un puerto (8443/TLS) y SOLO en
# 127.0.0.1. MongoDB y Elasticsearch viven en una red interna sin salida y sin
# puertos publicados. La API tampoco se expone directamente.
# ---------------------------------------------------------------------------
name: nosql-lab-seguro

x-certs: &certs ./certs:/certs:ro

networks:
  frontend: {}                 # nginx <-> API
  backend:
    internal: true             # API <-> datos, sin acceso desde el host ni a Internet

volumes:
  mongo_data: {}
  es_data: {}
  es_snapshots: {}

services:
  # ------------------------------------------------------------- MongoDB
  mongo:
    image: mongo:7
    networks: [backend]
    # Sin "ports:" => no accesible desde el host
    # --auth: autenticación SCRAM obligatoria · requireTLS: TLS en todas las conexiones
    # (el entrypoint oficial relaja ambos solo durante la inicialización local)
    command: ["--auth", "--bind_ip_all",
              "--tlsMode", "requireTLS",
              "--tlsCertificateKeyFile", "/certs/mongo.pem",
              "--tlsCAFile", "/certs/ca.crt",
              "--tlsAllowConnectionsWithoutCertificates"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?ejecuta scripts/gen_env.sh}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?ejecuta scripts/gen_env.sh}
      MONGO_INITDB_DATABASE: tienda
      MONGO_APP_USER: ${MONGO_APP_USER:?}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?}
    volumes:
      - mongo_data:/data/db
      - *certs
      - ./secure/init_mongo_secure.js:/docker-entrypoint-initdb.d/init_mongo_secure.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --tls --tlsCAFile /certs/ca.crt --host localhost -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # ------------------------------------------------------- Elasticsearch
  es-perms:                    # prepara el volumen de snapshots para el uid 1000 de ES
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    user: "0"
    entrypoint: ["sh", "-c", "chown -R 1000:0 /snapshots && echo ok"]
    volumes: ["es_snapshots:/snapshots"]
    network_mode: none
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    networks: [backend]
    depends_on:
      es-perms: { condition: service_completed_successfully }
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"                      # autenticación y RBAC
      xpack.security.http.ssl.enabled: "true"             # TLS en la API REST
      xpack.security.http.ssl.key: certs/elasticsearch.key
      xpack.security.http.ssl.certificate: certs/elasticsearch.crt
      xpack.security.http.ssl.certificate_authorities: certs/ca.crt
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?}
      path.repo: /usr/share/elasticsearch/snapshots      # repositorio de snapshots
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - es_snapshots:/usr/share/elasticsearch/snapshots
      - ./certs:/usr/share/elasticsearch/config/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s --cacert config/certs/ca.crt -u \"elastic:$$ELASTIC_PASSWORD\" https://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      timeout: 10s
      retries: 60

  es-init:                     # índice de prueba + rol y usuario de solo lectura para la API
    image: curlimages/curl:8.11.1
    networks: [backend]
    depends_on:
      elasticsearch: { condition: service_healthy }
    environment:
      ES_URL: https://elasticsearch:9200
      ES_USER: elastic
      ES_PASS: ${ELASTIC_PASSWORD:?}
      ES_CACERT: /certs/ca.crt
      CREATE_RBAC: "true"
      APP_ES_USER: ${ES_APP_USER:?}
      APP_ES_PASS: ${ES_APP_PASSWORD:?}
    volumes:
      - ./init_elastic.sh:/init_elastic.sh:ro
      - *certs
    entrypoint: ["sh", "/init_elastic.sh"]
    restart: "no"

  # ----------------------------------------------------------------- API
  fastapi-app:
    build: ./fastapi-app
    networks: [frontend, backend]
    depends_on:
      mongo: { condition: service_healthy }
      es-init: { condition: service_completed_successfully }
    environment:
      APP_MODULE: app.main_secure:app
      MONGO_HOST: mongo
      MONGO_DATABASE: tienda
      MONGO_APP_USER: ${MONGO_APP_USER:?}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?}
      MONGO_TLS: "true"
      ELASTIC_URL: https://elasticsearch:9200
      ES_APP_USER: ${ES_APP_USER:?}
      ES_APP_PASSWORD: ${ES_APP_PASSWORD:?}
      TLS_CA_FILE: /certs/ca.crt
      JWT_SECRET: ${JWT_SECRET:?}
      ENABLE_DOCS: "false"
    volumes:
      - *certs
      - ./logs:/app/logs
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # ---------------------------------------------- Proxy TLS (única entrada)
  nginx:
    image: nginx:1.27-alpine
    networks: [frontend]
    depends_on: [fastapi-app]
    ports: ["127.0.0.1:8443:443"]          # solo loopback y solo HTTPS
    volumes:
      - ./secure/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
