# Proxy inverso TLS: única puerta de entrada al escenario endurecido.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/api.crt;
    ssl_certificate_key /etc/nginx/certs/api.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    server_tokens off;
    client_max_body_size 16k;          # los cuerpos de la API son pequeños

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Formato de log con la IP real y el estado (trazabilidad)
    access_log /dev/stdout;

    location / {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass         http://fastapi-app:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }
}
